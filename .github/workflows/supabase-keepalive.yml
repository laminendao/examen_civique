# Empêche la mise en veille du projet Supabase gratuit (pause après ~7 jours sans activité).
# Une petite requête à la base deux fois par semaine suffit. Aucune donnée n'est lue ni modifiée.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * 1,4"   # lundi et jeudi à 6 h 17 UTC
  workflow_dispatch:          # bouton « Run workflow » pour tester à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête légère vers la base Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/progress?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Réponse Supabase : $code"
          test "$code" = "200"
